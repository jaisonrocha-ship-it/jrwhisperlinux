<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231858"/>
      <stop offset="1" stop-color="#0B0920"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="530" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#8A63FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8A63FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="512" cy="440" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C1445"/>
      <stop offset="1" stop-color="#0A0722"/>
    </radialGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#3D6BFF" stop-opacity="0.95"/><stop offset="0.45" stop-color="#3D6BFF" stop-opacity="0.4"/><stop offset="1" stop-color="#3D6BFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#D45CFF" stop-opacity="0.95"/><stop offset="0.45" stop-color="#D45CFF" stop-opacity="0.4"/><stop offset="1" stop-color="#D45CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#8A63FF" stop-opacity="0.9"/><stop offset="0.45" stop-color="#8A63FF" stop-opacity="0.35"/><stop offset="1" stop-color="#8A63FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="b4"><stop offset="0" stop-color="#2FC8FF" stop-opacity="0.75"/><stop offset="1" stop-color="#2FC8FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="rim" cx="512" cy="530" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#D45CFF" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#C46CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F2D9FF" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="spec" cx="410" cy="350" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="orb"><circle cx="512" cy="530" r="320"/></clipPath>
  </defs>

  <!-- squircle estilo macOS -->
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#bg)"/>
  <rect x="42" y="42" width="940" height="940" rx="210" fill="none" stroke="url(#edge)" stroke-width="4"/>

  <!-- esfera de plasma (mesmo desenho do Orbe do overlay, acento índigo) -->
  <circle cx="512" cy="530" r="420" fill="url(#glow)"/>
  <circle cx="512" cy="530" r="320" fill="url(#core)"/>
  <g clip-path="url(#orb)">
    <circle cx="400" cy="600" r="240" fill="url(#b1)"/>
    <circle cx="630" cy="440" r="230" fill="url(#b2)"/>
    <circle cx="560" cy="650" r="200" fill="url(#b3)"/>
    <circle cx="380" cy="400" r="160" fill="url(#b4)"/>
    <circle cx="512" cy="530" r="320" fill="url(#rim)"/>
  </g>
  <circle cx="410" cy="350" r="150" fill="url(#spec)"/>

  <!-- mic (Lucide) -->
  <g transform="translate(512 536) scale(13.5) translate(-12 -12)" fill="none" stroke="#FFFFFF"
     stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="2" width="6" height="13" rx="3" fill="#FFFFFF" fill-opacity="0.16"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
  </g>
</svg>
